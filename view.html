<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=480, initial-scale=1" />
  <title>Weather Frame V2 Preview</title>
  <style>
    :root{
      --w:480px; --h:800px; --pad:14px; --gap:10px; --r:14px;
      --ink:#111; --soft:#bdbdbd; --bg:#cfcfcf;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    .frame{width:var(--w);min-height:var(--h);background:#fff;margin:0 auto;padding:var(--pad);position:relative}
    .render .controls{display:none}
    h1{margin:0;font-size:44px;line-height:1;font-weight:900;letter-spacing:-1px}
    .meta{margin-top:6px;font-size:13px;font-weight:800;opacity:.9}
    .rule{height:3px;background:#000;opacity:.9;margin:10px 0 12px}
    .controls{display:flex;gap:10px;margin-bottom:10px}
    select{appearance:none;-webkit-appearance:none;padding:10px 16px;border-radius:16px;border:2px solid var(--soft);font-size:14px;font-weight:800;background:#fff}
    .grid2,.grid3{display:grid;gap:var(--gap)}
    .grid2{grid-template-columns:1fr 1fr}
    .grid3{grid-template-columns:1fr 1fr 1fr}
    .panel{border:2px solid var(--soft);border-radius:18px;padding:12px;background:#fff}
    .kicker{font-size:10px;letter-spacing:5px;font-weight:900;text-transform:uppercase;opacity:.62}
    .hero{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;margin-top:6px}
    .icoBox{width:52px;height:52px;border:2px solid var(--soft);border-radius:16px;display:flex;align-items:center;justify-content:center}
    .mainRow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .mainWx{font-size:28px;font-weight:900;line-height:1.05}
    .mainTemp{font-size:40px;font-weight:950;line-height:1}
    .sub{margin-top:4px;font-size:14px;font-weight:800}
    .muted{opacity:.78}
    .adviceLines{font-size:16px;font-weight:800;line-height:1.24;margin-top:8px}
    .statusRow{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-top:6px}
    .statusBig{font-size:18px;font-weight:950}
    .statusSub{font-size:13px;font-weight:800}
    .pill{display:inline-block;padding:4px 10px;border:2px solid #111;border-radius:999px;font-size:12px;font-weight:900;text-transform:uppercase}
    .good{background:#fff}
    .warn{background:#efefef}
    .bad{background:#dcdcdc}
    .bands{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}
    .band{border:2px solid #111;border-radius:16px;padding:10px;text-align:center;min-height:150px}
    .time{font-size:18px;font-weight:950}
    .wx{font-size:13px;font-weight:900;margin-top:8px}
    .det{font-size:12px;font-weight:800;line-height:1.35;margin-top:6px}
    .risk{font-size:12px;font-weight:900;margin-top:10px}
    .days{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}
    .day{border:2px solid #111;border-radius:16px;padding:10px 8px;text-align:center;min-height:108px}
    .dow{font-size:18px;font-weight:900}
    .temp{font-size:20px;font-weight:950;margin-top:8px}
    .mm{font-size:13px;font-weight:800;margin-top:8px}
    .footer{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:900;margin-top:8px}
    .hide{display:none!important}
  </style>
</head>
<body>
  <div class="frame" id="root">
    <h1 id="title">Sauze d’Oulx</h1>
    <div class="meta" id="meta">Via Lattea • Paese 1509 m • Quota 2300 m • OGGI</div>

    <div class="controls" id="controls">
      <select id="placeSelect"><option value="sauze">Sauze d’Oulx</option><option value="sestriere">Sestriere</option><option value="cesana">Cesana</option></select>
      <select id="langSelect"><option value="it">IT</option><option value="en">EN</option></select>
      <select id="modeSelect"><option value="auto">AUTO</option><option value="oggi">OGGI</option><option value="domani">DOMANI</option></select>
      <select id="seasonSelect"><option value="auto">AUTO STAGIONE</option><option value="winter">INVERNO</option><option value="summer">ESTATE</option></select>
    </div>

    <div class="rule"></div>

    <div class="grid2">
      <div class="panel">
        <div class="kicker" id="kMain">PAESE</div>
        <div class="hero">
          <div class="icoBox" id="mainIcon"></div>
          <div>
            <div class="mainRow"><div class="mainWx" id="mainWx"></div><div class="mainTemp" id="mainTemp"></div></div>
            <div class="sub" id="mainSub"></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="kicker" id="kAdvice">CONSIGLI PER OGGI</div>
        <div class="adviceLines" id="advice"></div>
      </div>
    </div>

    <div class="rule" style="margin:10px 0"></div>

    <div class="grid2" style="margin-bottom:10px">
      <div class="panel">
        <div class="kicker" id="kTrendVillage">ANDAMENTO PAESE</div>
        <div class="statusBig" id="trendVillage" style="margin-top:10px"></div>
      </div>
      <div class="panel">
        <div class="kicker" id="kTrendLift">ANDAMENTO QUOTA</div>
        <div class="statusBig" id="trendLift" style="margin-top:10px"></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:10px">
      <div class="statusRow">
        <div>
          <div class="kicker" id="kStatus">STATO MONTAGNA</div>
          <div class="statusBig" id="mountainTitle">Caricamento…</div>
          <div class="statusSub muted" id="mountainSub"></div>
        </div>
        <div class="pill good" id="mountainPill">--</div>
      </div>
    </div>

    <div class="panel" id="winterPanel" style="margin-bottom:10px">
      <div class="statusRow">
        <div>
          <div class="kicker">QUOTA IMPIANTI</div>
          <div class="statusBig">FASCE SCI</div>
        </div>
        <div class="statusBig" id="skiNow">Ora --.-° • Vento --</div>
      </div>
      <div class="bands" id="bandsWinter"></div>
    </div>

    <div class="panel hide" id="summerPanel" style="margin-bottom:10px">
      <div class="statusRow">
        <div>
          <div class="kicker">ESCURSIONI</div>
          <div class="statusBig">FASCE OUTDOOR</div>
        </div>
        <div class="statusBig" id="hikeNow">Ora --.-° • UV --</div>
      </div>
      <div class="bands" id="bandsSummer"></div>
    </div>

    <div class="panel">
      <div class="kicker" id="kNext">PROSSIMI 3 GIORNI</div>
      <div class="days" id="days"></div>
      <div class="footer"><div id="updated">Aggiornato: --:--</div><div id="source">Fonte: preview mock</div></div>
    </div>
  </div>

<script>
const PLACES = [
  { key:"sauze", name:"Sauze d’Oulx", town:1509, lifts:2300, region:"Via Lattea" },
  { key:"sestriere", name:"Sestriere", town:2035, lifts:2700, region:"Via Lattea" },
  { key:"cesana", name:"Cesana", town:1354, lifts:2300, region:"Via Lattea" }
];
const I18N = {
  it:{today:"OGGI", tomorrow:"DOMANI", source:"Fonte", updated:"Aggiornato", village:"PAESE", adviceToday:"CONSIGLI PER OGGI", adviceTomorrow:"CONSIGLI PER DOMANI", trendVillage:"ANDAMENTO PAESE", trendLift:"ANDAMENTO QUOTA IMPIANTI", next3:"PROSSIMI 3 GIORNI (PAESE)", now:"Ora", wind:"Vento", uv:"UV"},
  en:{today:"TODAY", tomorrow:"TOMORROW", source:"Source", updated:"Updated", village:"VILLAGE", adviceToday:"TIPS FOR TODAY", adviceTomorrow:"TIPS FOR TOMORROW", trendVillage:"VILLAGE TREND", trendLift:"LIFT ALTITUDE TREND", next3:"NEXT 3 DAYS (VILLAGE)", now:"Now", wind:"Wind", uv:"UV"}
};
function $(id){return document.getElementById(id)}
function round0(v){return Math.round(v)}
function pad2(n){return String(n).padStart(2,"0")}
function perceivedTemp(temp, wind){return Math.round(13.12 + 0.6215*temp - 11.37*Math.pow(Math.max(wind,1),0.16) + 0.3965*temp*Math.pow(Math.max(wind,1),0.16))}
function wxToLabel(code, lang){
  const map = {0:["Sereno","Clear"],1:["Quasi sereno","Mostly clear"],2:["Variabile","Partly cloudy"],3:["Nuvoloso","Cloudy"],45:["Nebbia","Fog"],51:["Pioviggine","Drizzle"],61:["Pioggia","Rain"],71:["Neve","Snow"],95:["Temporali","Storm"]};
  const x = map[code] || map[2]; return lang==="en"?x[1]:x[0];
}
function wxIcon(code){
  if ([71,73,75,77,85,86].includes(code)) return "❄️";
  if ([61,63,65,80,81,82,51,53,55].includes(code)) return "🌧️";
  if ([95,96,99].includes(code)) return "⛈️";
  if ([45,48].includes(code)) return "🌫️";
  if (code===0 || code===1) return "☀️";
  if (code===2) return "⛅";
  return "☁️";
}
function seasonFromData(data){
  if (data?.season) return data.season;
  const m = new Date().getMonth()+1;
  return (m<=3 || m>=12) ? "winter" : "summer";
}
function riskLabel(mm, wind, season, lang){
  if (season==="summer") return wind>30 ? (lang==="en"?"windy":"ventoso") : (lang==="en"?"good":"buono");
  if (wind>35) return (lang==="en"?"attention wind":"attenzione vento");
  if (mm>1) return (lang==="en"?"snow/rain risk":"rischio precip");
  return (lang==="en"?"low risk":"rischio basso");
}
function mountainStatus(data, lang, forcedSeason){
  const season = forcedSeason==="auto" ? seasonFromData(data) : forcedSeason;
  if (season === "winter") {
    const ski = data.ski || {};
    const snow = data.snow || {};
    let pill = ski.status || "open";
    let title = pill === "open" ? (lang==="en"?"Ski conditions look good":"Condizioni sci buone") : pill === "partial" ? (lang==="en"?"Partial opening":"Apertura parziale") : (lang==="en"?"Limited opening":"Apertura limitata");
    let sub = `🎿 ${ski.lifts_open ?? 32}/${ski.lifts_total ?? 40} · ⛷️ ${ski.slopes_open ?? 71}/${ski.slopes_total ?? 120} · ❄️ ${snow.fresh ?? 4} cm`;
    return { season, title, sub, pill: pill.toUpperCase() };
  }
  const s = data.summer || { hiking:"good", uv_index:6, storm_risk:20 };
  const pill = s.hiking === "perfect" ? "GO" : s.hiking === "hot" ? "WARM" : "OK";
  const title = s.hiking === "perfect" ? (lang==="en"?"Great for hiking":"Ottimo per escursioni") : s.hiking === "hot" ? (lang==="en"?"Warm midday":"Caldo nelle ore centrali") : (lang==="en"?"Usable conditions":"Condizioni buone");
  const sub = `🥾 UV ${s.uv_index ?? 6} · ⛈️ ${s.storm_risk ?? 20}% · 🌬️ ${round0(data.lifts?.current?.wind_speed_10m ?? 12)} km/h`;
  return { season, title, sub, pill };
}
function buildSlots(hourly, season, lang){
  const times = season==="winter" ? [[9,13],[13,15],[15,18]] : [[8,11],[11,15],[15,19]];
  return times.map(([a,b]) => {
    const picks = hourly.time.map((t,i)=>({i,h:new Date(t).getHours()})).filter(x=>x.h>=a && x.h<b).map(x=>x.i);
    const ids = picks.length?picks:[0,1,2];
    const avg = arr => ids.reduce((s,i)=>s+(arr[i]||0),0)/ids.length;
    const code = hourly.weather_code[ids[0]] ?? 2;
    const temp = avg(hourly.temperature_2m);
    const wind = avg(hourly.wind_speed_10m);
    const mm = avg(hourly.precipitation);
    const perc = perceivedTemp(temp, wind);
    return { label:`${String(a).padStart(2,"0")}:00–${String(b).padStart(2,"0")}:00`, code, temp, wind, mm, perc, risk:riskLabel(mm, wind, season, lang) };
  });
}
function buildNext3(daily){
  const DOW = ["dom","lun","mar","mer","gio","ven","sab"];
  const out=[]; for(let k=1;k<=3;k++){ const d = new Date((daily.time[k]||daily.time[0])+"T12:00:00"); out.push({ dow:DOW[d.getDay()], code:daily.weather_code[k]??2, tmin:daily.temperature_2m_min[k]??0, tmax:daily.temperature_2m_max[k]??0, mm:daily.precipitation_sum[k]??0 }); }
  return out;
}
function mockData(placeKey){
  const base = {
    village:{ current:{ temperature_2m:4.0, weather_code:0, precipitation:0, wind_speed_10m:8 }, hourly:{ time:["2026-03-31T09:00:00","2026-03-31T10:00:00","2026-03-31T11:00:00","2026-03-31T13:00:00","2026-03-31T14:00:00","2026-03-31T15:00:00","2026-03-31T16:00:00","2026-03-31T17:00:00"], temperature_2m:[-1,0,1,3,4,4,3,2], weather_code:[2,2,0,0,0,2,2,2], precipitation:[0,0,0,0,0,0,0,0], wind_speed_10m:[7,8,9,10,11,10,9,8] }, daily:{ time:["2026-03-31","2026-04-01","2026-04-02","2026-04-03"], weather_code:[0,2,0,3], temperature_2m_min:[-3,-5,-2,-1], temperature_2m_max:[4,4,9,12], precipitation_sum:[0,0,0,0] } },
    lifts:{ current:{ temperature_2m:-2.2, weather_code:2, precipitation:0, wind_speed_10m:28 }, hourly:{ time:["2026-03-31T09:00:00","2026-03-31T10:00:00","2026-03-31T11:00:00","2026-03-31T13:00:00","2026-03-31T14:00:00","2026-03-31T15:00:00","2026-03-31T16:00:00","2026-03-31T17:00:00"], temperature_2m:[-4.3,-4,-3.5,-2,-2,-2.7,-2.8,-3], weather_code:[2,2,2,0,0,2,2,2], precipitation:[0,0,0,0,0,0,0,0], wind_speed_10m:[21,22,24,28,28,28,29,30] }, daily:{ time:["2026-03-31","2026-04-01","2026-04-02","2026-04-03"], weather_code:[2,2,0,3], temperature_2m_min:[-8,-9,-5,-3], temperature_2m_max:[-2,-1,2,5], precipitation_sum:[0,0,0,1] } },
    season:"winter",
    ski:{ status:"partial", lifts_open:32, lifts_total:40, slopes_open:71, slopes_total:120 },
    snow:{ fresh:4, base:88 },
    summer:{ hiking:"perfect", uv_index:6, storm_risk:20 }
  };
  if (placeKey === "sestriere") { base.village.current.temperature_2m = 1.5; base.lifts.current.temperature_2m = -4.5; base.ski.lifts_open = 35; }
  if (placeKey === "cesana") { base.village.current.temperature_2m = 6.5; base.lifts.current.temperature_2m = -0.5; base.snow.fresh = 1; }
  return base;
}
async function getData(placeKey){
  if (window.__WF_WEATHER__ && window.__WF_WEATHER__.village) return window.__WF_WEATHER__;
  return mockData(placeKey);
}
function render(data, placeKey, lang, mode, forcedSeason){
  const t = I18N[lang] || I18N.it;
  const place = PLACES.find(p=>p.key===placeKey) || PLACES[0];
  const season = forcedSeason==="auto" ? seasonFromData(data) : forcedSeason;
  const mStatus = mountainStatus(data, lang, forcedSeason);
  $("title").textContent = place.name;
  $("meta").textContent = `${place.region} • Paese ${place.town} m • Quota ${place.lifts} m • ${mode==="domani"?t.tomorrow:t.today}`;
  $("kMain").textContent = t.village;
  $("kAdvice").textContent = mode==="domani" ? t.adviceTomorrow : t.adviceToday;
  $("kTrendVillage").textContent = t.trendVillage;
  $("kTrendLift").textContent = t.trendLift;
  $("kNext").textContent = t.next3;
  $("updated").textContent = `${t.updated}: ${pad2(new Date().getHours())}:${pad2(new Date().getMinutes())}`;
  $("source").textContent = `${t.source}: ${window.__WF_WEATHER__ ? "server injected" : "preview mock"}`;

  const v = data.village, l = data.lifts;
  const dayIdx = mode==="domani" ? 1 : 0;
  $("mainIcon").textContent = wxIcon(v.current.weather_code);
  $("mainWx").textContent = wxToLabel(v.current.weather_code, lang);
  $("mainTemp").textContent = `${v.current.temperature_2m.toFixed(1)}°`;
  $("mainSub").textContent = `${round0(v.daily.temperature_2m_min[dayIdx])}° / ${round0(v.daily.temperature_2m_max[dayIdx])}°C • ${round0(v.daily.precipitation_sum[dayIdx])} mm • perc. ${perceivedTemp(v.current.temperature_2m, v.current.wind_speed_10m)}°`;

  const advice = season === "winter"
    ? `Cielo ${wxToLabel(v.current.weather_code, lang).toLowerCase()} — in quota percepita ${perceivedTemp(l.current.temperature_2m, l.current.wind_speed_10m)}° con vento ${round0(l.current.wind_speed_10m)} km/h.`
    : `Finestra migliore al mattino — temperatura gradevole e rischio temporali contenuto.`;
  $("advice").textContent = advice;
  $("trendVillage").textContent = `${wxIcon(v.daily.weather_code[dayIdx])} ${wxToLabel(v.daily.weather_code[dayIdx], lang)} • ${round0(v.daily.temperature_2m_min[dayIdx])}° / ${round0(v.daily.temperature_2m_max[dayIdx])}°C • ${round0(v.daily.precipitation_sum[dayIdx])} mm`;
  $("trendLift").textContent = `${wxIcon(l.daily.weather_code[dayIdx])} ${wxToLabel(l.daily.weather_code[dayIdx], lang)} • ${round0(l.daily.temperature_2m_min[dayIdx])}° / ${round0(l.daily.temperature_2m_max[dayIdx])}°C • ${round0(l.daily.precipitation_sum[dayIdx])} mm`;

  $("mountainTitle").textContent = mStatus.title;
  $("mountainSub").textContent = mStatus.sub;
  $("mountainPill").textContent = mStatus.pill;
  $("mountainPill").className = `pill ${mStatus.pill.includes("LIMIT") || mStatus.pill.includes("WARN") ? "warn" : "good"}`;

  $("winterPanel").classList.toggle("hide", season !== "winter");
  $("summerPanel").classList.toggle("hide", season !== "summer");

  if (season === "winter") {
    $("skiNow").textContent = `${t.now} ${l.current.temperature_2m.toFixed(1)}° • ${t.wind} ${round0(l.current.wind_speed_10m)} km/h`;
    const bands = buildSlots(l.hourly, "winter", lang);
    $("bandsWinter").innerHTML = bands.map(s => `<div class="band"><div class="time">${s.label}</div><div class="wx">${wxIcon(s.code)} ${wxToLabel(s.code, lang)}</div><div class="det">${s.temp.toFixed(1)}° • perc. ${s.perc}°<br>${t.wind} ${round0(s.wind)} km/h</div><div class="risk">${s.risk}</div></div>`).join("");
  } else {
    const uv = data.summer?.uv_index ?? 6;
    $("hikeNow").textContent = `${t.now} ${v.current.temperature_2m.toFixed(1)}° • ${t.uv} ${uv}`;
    const bands = buildSlots(v.hourly, "summer", lang);
    $("bandsSummer").innerHTML = bands.map(s => `<div class="band"><div class="time">${s.label}</div><div class="wx">${wxIcon(s.code)} ${wxToLabel(s.code, lang)}</div><div class="det">${s.temp.toFixed(1)}° • perc. ${s.perc}°<br>${t.wind} ${round0(s.wind)} km/h</div><div class="risk">${s.risk}</div></div>`).join("");
  }

  $("days").innerHTML = buildNext3(v.daily).map(d => `<div class="day"><div class="dow">${d.dow}</div><div style="font-size:26px;margin-top:8px">${wxIcon(d.code)}</div><div class="temp">${round0(d.tmin)}° / ${round0(d.tmax)}°</div><div class="mm">${round0(d.mm)} mm</div></div>`).join("");
  window.__WF_READY__ = true;
}
(async function init(){
  const params = new URLSearchParams(location.search);
  const place = (params.get("place") || "sauze").toLowerCase();
  const lang = (params.get("lang") || "it").toLowerCase();
  const mode = (params.get("mode") || "auto").toLowerCase();
  const season = (params.get("season") || "auto").toLowerCase();
  if (params.get("render") === "1") $("root").classList.add("render");
  $("placeSelect").value = place; $("langSelect").value = ["it","en"].includes(lang)?lang:"it"; $("modeSelect").value = ["auto","oggi","domani"].includes(mode)?mode:"auto"; $("seasonSelect").value = ["auto","winter","summer"].includes(season)?season:"auto";
  const rerender = async () => {
    const p = $("placeSelect").value, l = $("langSelect").value, m = $("modeSelect").value, s = $("seasonSelect").value;
    const data = await getData(p);
    render(data, p, l, m, s);
  };
  ["placeSelect","langSelect","modeSelect","seasonSelect"].forEach(id => $(id).addEventListener("change", rerender));
  await rerender();
})();
</script>
</body>
</html>
